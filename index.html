<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Franchise History | Elevation Edge Sports Data</title>
    <meta name="description" content="Interactive NHL team analytics: regular season, advanced possession metrics (xGF%, CF%, FF%), and Stanley Cup Playoff history powered by in-browser SQL. Supports Team and Franchise modes (e.g. QUE → COL).">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="header">NHL Franchise History</h1>
        <div class="team-header">
            <span id="teamAbbreviation"></span>
            <div id="teamLogos"></div>
            <h2 id="teamName"></h2>
        </div>

        <aside class="team-rail">
            <div class="selector-container">
                <div class="mode-block">
                    <span class="mode-label" id="modeLabel">Mode</span>
                    <div class="segment" role="group" aria-labelledby="modeLabel">
                        <button type="button" class="segment-btn" data-group="viewMode" value="team" aria-pressed="true">Team</button>
                        <button type="button" class="segment-btn" data-group="viewMode" value="franchise" aria-pressed="false">Franchise</button>
                    </div>
                </div>
                <div class="mode-block">
                    <div class="mode-caption">
                        <span class="mode-label" id="eraLabel">Era</span>
                        <span id="eraCount">32</span>
                    </div>
                    <div class="segment" role="group" aria-labelledby="eraLabel">
                        <button type="button" class="segment-btn" data-group="eraMode" value="current" aria-pressed="true">Current</button>
                        <button type="button" class="segment-btn" data-group="eraMode" value="historical" aria-pressed="false">Historical</button>
                        <button type="button" class="segment-btn" data-group="eraMode" value="all" aria-pressed="false">All</button>
                    </div>
                </div>
                <div class="team-picker">
                    <div class="team-picker-bar">
                        <span id="selectorLabel" class="selector-label">Select Team:</span>
                        <input type="text" id="teamFilter" placeholder="Filter" aria-label="Filter" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </div>
            <p id="teamListEmpty" class="team-list-empty" hidden>No matches</p>
            <div id="teamList" role="group" aria-labelledby="selectorLabel"></div>
        </aside>

        <div class="page-main">
        <div id="insightsPanel" class="insights-panel"></div>

        <div class="charts-container">
            <div class="chart chart-wide">
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart">
                <canvas id="scatterChart"></canvas>
            </div>
            <div class="chart">
                <canvas id="playoffWinsHistogram"></canvas>
            </div>
            <div class="chart">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <div class="table-area">
            <div class="table-container">
                <table id="teamDataTable">
                    <thead>
                        <tr class="group-header">
                            <th colspan="2" class="group-identity">Team</th>
                            <th colspan="9" class="group-regular">Regular Season</th>
                            <th colspan="3" class="group-playoffs">Playoffs</th>
                            <th colspan="3" class="group-advanced">Advanced Stats</th>
                        </tr>
                        <tr class="column-header">
                            <th class="sticky-col">Logo</th>
                            <th class="sortable sticky-col" data-column="year">Year <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_gp">GP <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_w">W <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_l">L <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_otl">OTL <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_pts">PTS <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_pts_pct">PTS% <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_gf">GF <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_ga">GA <span class="sort-arrow"></span></th>
                            <th class="sortable group-regular" data-column="rs_gd">GD <span class="sort-arrow"></span></th>
                            <th class="sortable group-playoffs" data-column="elim_rank">Rank <span class="sort-arrow"></span></th>
                            <th class="sortable group-playoffs" data-column="elim_order">Elim Order <span class="sort-arrow"></span></th>
                            <th class="sortable group-playoffs" data-column="playoff_wins">Playoff Wins <span class="sort-arrow"></span></th>
                            <th class="sortable group-advanced" data-column="xgf_pct">xGF% <span class="sort-arrow"></span></th>
                            <th class="sortable group-advanced" data-column="cf_pct">CF% <span class="sort-arrow"></span></th>
                            <th class="sortable group-advanced" data-column="ff_pct">FF% <span class="sort-arrow"></span></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
